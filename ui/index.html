<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDLite</title>
<link id="hljs-theme" rel="stylesheet" href="vendor/hljs-github.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light" class="outline-open">

<!-- 拖放遮罩 -->
<div id="drop-overlay" hidden><div class="drop-box"><b>松开以打开文件</b><span>支持 .md / .markdown / .txt</span></div></div>

<!-- 大纲侧栏 -->
<aside id="outline">
  <div class="ol-head">
    <span class="ol-title">大纲</span>
    <span class="ol-actions">
      <button id="ol-fold-all" class="icon-btn" title="折叠全部章节">⇑</button>
      <button id="ol-expand-all" class="icon-btn" title="展开全部章节">⇓</button>
      <button id="ol-close" class="icon-btn" title="收起大纲 (Ctrl+B)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
    </span>
  </div>
  <nav id="ol-tree"></nav>
  <div class="ol-foot" id="doc-stats"></div>
</aside>

<!-- 主区域 -->
<main id="main">
  <header id="topbar">
    <button class="icon-btn" id="btn-outline" title="大纲 (Ctrl+B)"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M2 4h12M2 8h9M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></button>
    <div id="file-indicator" title="MDLite">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="#2f6fed"/><text x="9" y="17" font-size="12" font-weight="bold" fill="#fff" font-family="Segoe UI, sans-serif">M</text><path d="M17.5 7v6.5M17.5 15.5l-2.4-2.6M17.5 15.5l2.4-2.6" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span id="file-name">MDLite</span>
    </div>
    <div class="topbar-spacer"></div>

    <div class="seg" id="mode-switch" title="阅读 / 编辑 (Ctrl+E)">
      <button id="mode-read" class="active">阅读</button>
      <button id="mode-edit">编辑</button>
    </div>

    <button class="icon-btn" id="btn-find" title="在文档中查找 (Ctrl+F)"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <div class="font-group">
      <button class="icon-btn" id="btn-font-minus" title="减小字号"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="btn-font-plus" title="增大字号"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <button class="icon-btn" id="btn-width" title="阅读宽度：宽 / 窄"><svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M6.2 3v10" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="icon-btn" id="btn-theme" title="主题：自动 / 亮 / 暗"><svg id="theme-icon" viewBox="0 0 16 16" width="16" height="16"></svg></button>
    <button class="icon-btn" id="btn-zen" title="禅模式 (F8)"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M2.5 6V3.5H5M13.5 6V3.5H11M2.5 10v2.5H5M13.5 10v2.5H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
    <button class="icon-btn" id="btn-menu" title="更多"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg></button>
  </header>

  <!-- 编辑模式工具栏 -->
  <div id="edit-toolbar" hidden>
    <button data-md="h1" title="一级标题">#</button>
    <button data-md="h2" title="二级标题">##</button>
    <button data-md="h3" title="三级标题">###</button>
    <i></i>
    <button data-md="bold" title="粗体 (Ctrl+B)"><b>B</b></button>
    <button data-md="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
    <button data-md="strike" title="删除线"><s>S</s></button>
    <button data-md="code" title="行内代码">&lt;&gt;</button>
    <i></i>
    <button data-md="ul" title="无序列表">•—</button>
    <button data-md="task" title="任务列表">☑</button>
    <button data-md="quote" title="引用">❝</button>
    <i></i>
    <button data-md="codeblock" title="代码块">{ }</button>
    <button data-md="table" title="表格">▦</button>
    <button data-md="link" title="链接">🔗</button>
    <button data-md="math" title="数学公式">∑</button>
    <button data-md="hr" title="分隔线">—</button>
  </div>

  <!-- 查找栏 -->
  <div id="findbar" hidden>
    <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="find-input" type="text" placeholder="在文档中查找…" spellcheck="false">
    <span id="find-count">0 / 0</span>
    <button class="icon-btn" id="find-prev" title="上一个 (Shift+Enter)">↑</button>
    <button class="icon-btn" id="find-next" title="下一个 (Enter)">↓</button>
    <button class="icon-btn" id="find-close" title="关闭 (Esc)">×</button>
  </div>

  <div id="workspace">
    <section id="editor-pane">
      <div id="editor-status"></div>
      <textarea id="editor" spellcheck="false" placeholder="# 在这里输入 Markdown…"></textarea>
    </section>
    <div id="scroll-area">
      <article id="content" class="md-body"></article>

      <!-- 欢迎页 -->
      <section id="welcome" hidden>
        <div class="w-card">
          <svg viewBox="0 0 24 24" width="72" height="72"><rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="#2f6fed"/><text x="8" y="17.5" font-size="13" font-weight="bold" fill="#fff" font-family="Segoe UI, sans-serif">M</text><path d="M17.5 6.5v7M17.5 16l-2.6-2.8M17.5 16l2.6-2.8" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <h1>MDLite</h1>
          <p class="w-sub">轻、快、离线的 Markdown 阅读器 · 无网络 · 无 Electron</p>
          <button id="w-open" class="btn-primary">打开文件…</button>
          <p class="w-drag">或将 <b>.md</b> 文件直接拖入本窗口</p>
          <div class="w-recent" id="w-recent" hidden>
            <div class="w-recent-title">最近打开</div>
            <div id="w-recent-list"></div>
          </div>
          <div class="w-keys"><kbd>Ctrl+O</kbd> 打开 · <kbd>Ctrl+E</kbd> 编辑 · <kbd>Ctrl+B</kbd> 大纲 · <kbd>Ctrl+F</kbd> 查找 · <kbd>F1</kbd> 帮助</div>
        </div>
      </section>
    </div>
  </div>
</main>

<!-- 打字机 / 自动滚动 -->
<div id="teleprompter" hidden>
  <button id="tp-play" title="播放 / 暂停">▶</button>
  <input type="range" id="tp-speed" min="10" max="200" step="5" value="40">
  <span id="tp-speed-val">40 px/s</span>
  <button id="tp-close" class="icon-btn" title="关闭 (Esc)">×</button>
</div>

<!-- 更多菜单 -->
<div id="menu" hidden>
  <div id="menu-recents" hidden>
    <div class="menu-label">最近打开</div>
    <div id="menu-recent-list"></div>
    <hr>
  </div>
  <button class="menu-item" data-act="open"><span>打开文件…</span><kbd>Ctrl+O</kbd></button>
  <button class="menu-item" data-act="fold-all"><span>折叠全部章节</span></button>
  <button class="menu-item" data-act="expand-all"><span>展开全部章节</span></button>
  <hr>
  <button class="menu-item" data-act="export"><span>导出为 HTML…</span></button>
  <button class="menu-item" data-act="reveal"><span>在文件夹中显示</span></button>
  <button class="menu-item" data-act="teleprompter"><span>自动滚动（讲稿模式）</span><kbd>Ctrl+Shift+T</kbd></button>
  <hr>
  <div class="menu-row"><span>主题</span>
    <span class="seg seg-sm" id="menu-theme">
      <button data-theme-val="auto">自动</button>
      <button data-theme-val="light">亮</button>
      <button data-theme-val="dark">暗</button>
    </span>
  </div>
  <div class="menu-row"><span>字号</span>
    <span class="menu-inline"><button class="mini-btn" data-act="font-minus">−</button><b id="menu-font-val">17</b><button class="mini-btn" data-act="font-plus">+</button></span>
  </div>
  <div class="menu-row"><span>阅读宽度</span>
    <span class="menu-inline"><b id="menu-width-val">标准</b><button class="mini-btn" data-act="width-toggle">切换</button></span>
  </div>
  <hr>
  <button class="menu-item" data-act="help"><span>快捷键与帮助</span><kbd>F1</kbd></button>
  <button class="menu-item" data-act="about"><span>关于 MDLite</span></button>
</div>

<!-- 帮助 / 关于 弹窗 -->
<div id="modal" hidden>
  <div id="modal-card">
    <div id="modal-body"></div>
    <button id="modal-close" class="btn-primary">知道了</button>
  </div>
</div>

<div id="toasts"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="app.js"></script>
</body>
</html>
