[package]
name = "mdlite"
version = "1.0.0"
description = "MDLite — 轻快、离线的 Markdown 阅读器"
authors = ["MDLite"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
encoding_rs = "0.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
